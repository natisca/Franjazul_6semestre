
<!-- Backdrop -->
<div 
  *ngIf="isOpen" 
  class="fixed inset-0 bg-black bg-opacity-50 z-40 transition-opacity duration-300"
  (click)="onClose()"
></div>

<!-- Modal -->
<div 
  *ngIf="isOpen"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto"
>
  <div 
    class="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-md transform transition-all duration-300 scale-100"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-700">
      <h2 class="text-xl font-bold text-blue-900 dark:text-blue-400">
        {{ isEditMode ? 'Editar Molécula' : 'Nueva Molécula' }}
      </h2>
      <button 
        (click)="onClose()"
        class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Body -->
    <form [formGroup]="moleculaForm" (ngSubmit)="onSubmit()" class="p-6">
      <!-- Nombre de la Molécula -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
          Nombre de la Molécula <span class="text-red-600">*</span>
          <span *ngIf="isEditMode" class="text-xs text-gray-500 font-normal ml-2">(No editable)</span>
        </label>
        <input
          type="text"
          formControlName="nombreMol"
          placeholder="Ejemplo: H2O"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100 uppercase"
          [class.border-red-500]="nombreMol?.invalid && nombreMol?.touched"
          [class.border-gray-300]="nombreMol?.valid || nombreMol?.untouched"
          [class.bg-gray-100]="isEditMode"
          [class.cursor-not-allowed]="isEditMode"
        />
        <div *ngIf="nombreMol?.invalid && nombreMol?.touched" class="mt-1">
          <p *ngIf="nombreMol?.errors?.['required']" class="text-sm text-red-600">
            El nombre es obligatorio
          </p>
          <p *ngIf="nombreMol?.errors?.['maxlength']" class="text-sm text-red-600">
            Máximo 20 caracteres
          </p>
        </div>
        <p class="text-xs text-gray-500 mt-1">
          {{ nombreMol?.value?.length || 0 }}/20 caracteres • Se convertirá a mayúsculas
        </p>
      </div>

      <!-- Descripción de la Molécula -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
          Descripción <span class="text-red-600">*</span>
        </label>
        <textarea
          formControlName="descripcionMol"
          rows="3"
          placeholder="Describe la molécula"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all resize-none dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100"
          [class.border-red-500]="descripcionMol?.invalid && descripcionMol?.touched"
          [class.border-gray-300]="descripcionMol?.valid || descripcionMol?.untouched"
        ></textarea>
        <div *ngIf="descripcionMol?.invalid && descripcionMol?.touched" class="mt-1">
          <p *ngIf="descripcionMol?.errors?.['required']" class="text-sm text-red-600">
            La descripción es obligatoria
          </p>
          <p *ngIf="descripcionMol?.errors?.['maxlength']" class="text-sm text-red-600">
            Máximo 100 caracteres
          </p>
        </div>
        <p class="text-xs text-gray-500 mt-1">
          {{ descripcionMol?.value?.length || 0 }}/100 caracteres
        </p>
      </div>

      <!-- Botones -->
      <div class="flex gap-3 justify-end">
        <button
          type="button"
          (click)="onClose()"
          class="px-4 py-2 border border-gray-300 text-gray-700 dark:text-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="moleculaForm.invalid"
          class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed"
        >
          {{ isEditMode ? 'Actualizar' : 'Crear' }} Molécula
        </button>
      </div>
    </form>
  </div>
</div>
