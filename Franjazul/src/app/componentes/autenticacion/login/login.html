<div class="min-h-screen bg-gradient-to-br from-background via-card to-accent flex items-center justify-center p-4 relative overflow-hidden">
  <!-- Partículas animadas -->
  <div class="absolute inset-0 pointer-events-none">
    <div
      *ngFor="let particle of particles"
      class="spray-particle"
      [style.left.px]="particle.x"
      [style.top.px]="particle.y"
    ></div>
  </div>

  <!-- Icono flotante -->
  <div class="absolute top-20 right-20 float-animation">
    <i class="bug-icon"></i>
  </div>

  <div class="card w-full max-w-md shadow-2xl border-0 bg-card/95 backdrop-blur-sm">
    <div class="card-header text-center space-y-4">
      <div class="mx-auto w-16 h-16 bg-primary rounded-full flex items-center justify-center">
        <i class="bug-icon big"></i>
      </div>
      <h2 class="text-2xl font-bold text-foreground">FranjAzul</h2>
      <p class="text-muted-foreground">Ingresa tus credenciales para acceder al sistema</p>
    </div>

    <div class="card-content space-y-6">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Correo -->
        <div class="space-y-2">
          <label for="email" class="text-foreground font-medium">Correo Electrónico</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder=""
            class="input"
            required
          />
        </div>

        <!-- Contraseña -->
        <div class="space-y-2">
          <label for="password" class="text-foreground font-medium">Contraseña</label>
          <div class="relative">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
              class="input pr-10"
              required
            />
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground"
            >
              <span *ngIf="showPassword">🙈</span>
              <span *ngIf="!showPassword">👁️</span>
            </button>
          </div>
        </div>

        <!-- Checkbox -->
        <div class="flex items-center space-x-2">
          <input
            id="show-password"
            type="checkbox"
            formControlName="showPassword"
            (change)="togglePassword()"
          />
          <label for="show-password" class="text-sm text-muted-foreground cursor-pointer">
            Mostrar contraseña
          </label>
        </div>

        <!-- Botón -->
        <button type="submit" class="btn w-full">Iniciar Sesión</button>
      </form>

      <div class="text-center">
        <p class="text-sm text-muted-foreground">FranjAzul v1.0</p>
      </div>
    </div>
  </div>

  <!-- Spray -->
  <div class="absolute bottom-10 left-10 spray-animation">
    <div class="w-8 h-8 bg-primary/20 rounded-full flex items-center justify-center">
      <div class="w-4 h-4 bg-primary rounded-full"></div>
    </div>
  </div>
</div>
