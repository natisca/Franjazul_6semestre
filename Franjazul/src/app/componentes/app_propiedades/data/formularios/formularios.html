<div class="p-6">
    <div class="flex items-center mb-4">
        <h1 class="text-2xl font-bold text-blue-900">Formularios</h1>
    </div>


    <div class="overflow-x-auto">
        <table class="min-w-full bg-white border border-gray-200 rounded-lg shadow-sm">
            <thead class="bg-blue-100">
                <tr>
                    <th class="px-4 py-2 text-left">ID</th>
                    <th class="px-4 py-2 text-left">Titulo</th>
                    <th class="px-4 py-2 text-left">URL</th>
                    <th class="px-4 py-2 text-left">Padre</th>
                    <th class="px-4 py-2 text-left">Orden</th>
                    <th class="px-4 py-2 text-left">Es Recursivo a</th>
                    <th class="px-4 py-2 text-center">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let f of form" class="border-t">
                    <td class="px-4 py-2">{{ f.ID_form }}</td>
                    <td class="px-4 py-2">{{ f.titulo_form }}</td>
                    <td class="px-4 py-2">{{ f.url_form }}</td>
                    <td class="px-4 py-2">{{ f.es_padre }}</td>
                    <td class="px-4 py-2">{{ f.orden }}</td>
                    <td class="px-4 py-2">{{ f.form_recursivo }}</td>
                    <td class="px-4 py-2 text-center">
                        <button (click)="eliminarFormulario(f.ID_form)"
                            class="px-3 py-1 bg-red-600 text-white rounded-lg hover:bg-red-500">
                            🗑 Eliminar
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
