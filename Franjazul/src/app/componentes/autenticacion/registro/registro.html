<div class="min-h-screen bg-gradient-to-br from-blue-50 via-blue-100 to-blue-500 flex items-center justify-center p-4 pt-24">
  
  <div class="w-full max-w-2xl shadow-2xl rounded-lg bg-white/95 backdrop-blur-sm p-8">
    
    <!-- Header -->
    <div class="text-center space-y-4 mb-6">
      <div class="mx-auto w-16 h-16 bg-blue-800 text-white rounded-full flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zM3 19.235v-.11a6.375 6.375 0 0112.75 0v.109A12.318 12.318 0 019.374 21c-2.331 0-4.512-.645-6.374-1.766z" />
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-gray-800">Crear Cuenta</h2>
      <p class="text-gray-500">Completa el formulario para registrarte</p>
    </div>

    <!-- Mensaje de error -->
    <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
      </svg>
      <span class="text-sm">{{ errorMessage }}</span>
    </div>

    <!-- Formulario -->
    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()" class="space-y-4">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <!-- ID Usuario -->
        <div>
          <label for="idUsuario" class="block text-sm font-medium text-gray-700 mb-1">
            Cédula / ID <span class="text-red-600">*</span>
          </label>
          <input 
            id="idUsuario" 
            type="text" 
            formControlName="idUsuario" 
            maxlength="10"
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
            [class.border-red-500]="idUsuario?.invalid && idUsuario?.touched"
          />
          <p *ngIf="idUsuario?.invalid && idUsuario?.touched" class="mt-1 text-xs text-red-600">
            ID es requerido (máx. 10 caracteres)
          </p>
        </div>

        <!-- Nombre -->
        <div>
          <label for="nombreUs" class="block text-sm font-medium text-gray-700 mb-1">
            Nombre <span class="text-red-600">*</span>
          </label>
          <input 
            id="nombreUs" 
            type="text" 
            formControlName="nombreUs" 
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
            [class.border-red-500]="nombreUs?.invalid && nombreUs?.touched"
          />
          <p *ngIf="nombreUs?.invalid && nombreUs?.touched" class="mt-1 text-xs text-red-600">
            Nombre es requerido
          </p>
        </div>

        <!-- Primer Apellido -->
        <div>
          <label for="apellidoUs" class="block text-sm font-medium text-gray-700 mb-1">
            Primer Apellido <span class="text-red-600">*</span>
          </label>
          <input 
            id="apellidoUs" 
            type="text" 
            formControlName="apellidoUs" 
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
            [class.border-red-500]="apellidoUs?.invalid && apellidoUs?.touched"
          />
          <p *ngIf="apellidoUs?.invalid && apellidoUs?.touched" class="mt-1 text-xs text-red-600">
            Primer apellido es requerido
          </p>
        </div>

        <!-- Segundo Apellido -->
        <div>
          <label for="apellido2Us" class="block text-sm font-medium text-gray-700 mb-1">
            Segundo Apellido
          </label>
          <input 
            id="apellido2Us" 
            type="text" 
            formControlName="apellido2Us" 
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
          />
        </div>

      </div>

      <!-- Email -->
      <div>
        <label for="emailUs" class="block text-sm font-medium text-gray-700 mb-1">
          Correo Electrónico <span class="text-red-600">*</span>
        </label>
        <input 
          id="emailUs" 
          type="email" 
          formControlName="emailUs" 
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
          [class.border-red-500]="emailUs?.invalid && emailUs?.touched"
        />
        <p *ngIf="emailUs?.invalid && emailUs?.touched" class="mt-1 text-xs text-red-600">
          Email válido es requerido
        </p>
      </div>

      <!-- Teléfono -->
      <div>
        <label for="telefonoUs" class="block text-sm font-medium text-gray-700 mb-1">
          Teléfono <span class="text-red-600">*</span>
        </label>
        <input 
          id="telefonoUs" 
          type="tel" 
          formControlName="telefonoUs" 
          maxlength="10"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
          [class.border-red-500]="telefonoUs?.invalid && telefonoUs?.touched"
        />
        <p *ngIf="telefonoUs?.invalid && telefonoUs?.touched" class="mt-1 text-xs text-red-600">
          Teléfono debe tener 10 dígitos
        </p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <!-- Contraseña -->
        <div>
          <label for="passwordUs" class="block text-sm font-medium text-gray-700 mb-1">
            Contraseña <span class="text-red-600">*</span>
          </label>
          <div class="relative">
            <input 
              id="passwordUs" 
              [type]="showPassword ? 'text' : 'password'" 
              formControlName="passwordUs" 
              class="w-full px-4 py-2 pr-10 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
              [class.border-red-500]="passwordUs?.invalid && passwordUs?.touched"
            />
            <button 
              type="button" 
              (click)="togglePassword()"
              class="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600">
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            </button>
          </div>
          <p *ngIf="passwordUs?.invalid && passwordUs?.touched" class="mt-1 text-xs text-red-600">
            Mínimo 6 caracteres
          </p>
        </div>

        <!-- Confirmar Contraseña -->
        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">
            Confirmar Contraseña <span class="text-red-600">*</span>
          </label>
          <div class="relative">
            <input 
              id="confirmPassword" 
              [type]="showConfirmPassword ? 'text' : 'password'" 
              formControlName="confirmPassword" 
              class="w-full px-4 py-2 pr-10 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
              [class.border-red-500]="confirmPassword?.invalid && confirmPassword?.touched"
            />
            <button 
              type="button" 
              (click)="toggleConfirmPassword()"
              class="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600">
              <svg *ngIf="!showConfirmPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <svg *ngIf="showConfirmPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            </button>
          </div>
          <p *ngIf="confirmPassword?.hasError('passwordMismatch') && confirmPassword?.touched" class="mt-1 text-xs text-red-600">
            Las contraseñas no coinciden
          </p>
        </div>

      </div>

      <!-- Botón Registrar -->
      <button 
        type="submit" 
        [disabled]="loading || registroForm.invalid"
        class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center justify-center gap-2 font-medium">
        <svg *ngIf="loading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>{{ loading ? 'Registrando...' : 'Registrarse' }}</span>
      </button>

      <!-- Link a Login -->
      <div class="text-center">
        <p class="text-sm text-gray-600">
          ¿Ya tienes cuenta? 
          <button 
            type="button"
            (click)="navigateToLogin()"
            class="text-blue-600 hover:text-blue-800 font-medium">
            Inicia sesión
          </button>
        </p>
      </div>

    </form>
  </div>
</div>
