<!-- Backdrop -->
<div 
  *ngIf="isOpen" 
  class="fixed inset-0 bg-black bg-opacity-50 z-40 transition-opacity duration-300"
  (click)="onClose()"
></div>

<!-- Modal -->
<div 
  *ngIf="isOpen"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto"
>
  <div 
    class="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-md transform transition-all duration-300 scale-100"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-700">
      <h2 class="text-xl font-bold text-blue-900 dark:text-blue-400">
        {{ isEditMode ? 'Editar Tipo de Lugar' : 'Nuevo Tipo de Lugar' }}
      </h2>
      <button 
        (click)="onClose()"
        class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Body -->
    <form [formGroup]="tipoLugarForm" (ngSubmit)="onSubmit()" class="p-6">
      <!-- Nombre del Tipo de Lugar -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
          Nombre del Tipo de Lugar <span class="text-red-600">*</span>
        </label>
        <input
          type="text"
          formControlName="nombreTl"
          placeholder="Ejemplo: Salón de eventos"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100"
          [class.border-red-500]="nombreTl?.invalid && nombreTl?.touched"
          [class.border-gray-300]="nombreTl?.valid || nombreTl?.untouched"
        />
        <div *ngIf="nombreTl?.invalid && nombreTl?.touched" class="mt-1">
          <p *ngIf="nombreTl?.errors?.['required']" class="text-sm text-red-600">
            El nombre es obligatorio
          </p>
          <p *ngIf="nombreTl?.errors?.['maxlength']" class="text-sm text-red-600">
            El nombre no puede exceder 50 caracteres
          </p>
        </div>
        <p class="text-xs text-gray-500 mt-1">
          {{ nombreTl?.value?.length || 0 }}/50 caracteres
        </p>
      </div>

      <!-- Botones -->
      <div class="flex gap-3 justify-end">
        <button
          type="button"
          (click)="onClose()"
          class="px-4 py-2 border border-gray-300 text-gray-700 dark:text-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="tipoLugarForm.invalid"
          class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed"
        >
          {{ isEditMode ? 'Actualizar' : 'Crear' }} Tipo de Lugar
        </button>
      </div>
    </form>
  </div>
</div>
