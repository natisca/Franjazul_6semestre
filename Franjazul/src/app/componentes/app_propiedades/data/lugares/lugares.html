<div class="p-6">
    <div class="flex items-center mb-4">
        <h1 class="text-2xl font-bold text-blue-900">Usuarios</h1>
    </div>


    <div class="overflow-x-auto">
        <table class="min-w-full bg-white border border-gray-200 rounded-lg shadow-sm">
            <thead class="bg-blue-100">
                <tr>
                    <th class="px-4 py-2 text-left">ID</th>
                    <th class="px-4 py-2 text-left">Nombre</th>
                    <th class="px-4 py-2 text-left">direccion</th>
                    <th class="px-4 py-2 text-left">Lugar</th>
                    <th class="px-4 py-2 text-left">tipo de lugar</th>
                    <th class="px-4 py-2 text-center">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let ll of lista_lugares" class="border-t">
                    <td class="px-4 py-2">{{ ll.ID_lugar }}</td>
                    <td class="px-4 py-2">{{ ll.nombre_lugar }}</td>
                    <td class="px-4 py-2">{{ ll.direccion_lugar }}</td>
                    <td class="px-4 py-2">{{ ll.lugar_dentro_lugar }}</td>
                    <td class="px-4 py-2">{{ ll.TL_del_lugar }}</td>
                    <td class="px-4 py-2 text-center">
                        <button (click)="eliminarLugar(ll.ID_lugar)"
                            class="px-3 py-1 bg-red-600 text-white rounded-lg hover:bg-red-500">
                            🗑 Eliminar
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
