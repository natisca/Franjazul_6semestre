<div class="p-6">
    <div class="flex items-center mb-4">
        <h1 class="text-2xl font-bold text-blue-900">Cargos</h1>
    </div>


    <div class="overflow-x-auto">
        <table class="min-w-full bg-white border border-gray-200 rounded-lg shadow-sm">
            <thead class="bg-blue-100">
                <tr>
                    <th class="px-4 py-2 text-left">Nombre</th>
                    <th class="px-4 py-2 text-left">Descripcion</th>                    
                    <th class="px-4 py-2 text-center">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let c of cargos" class="border-t">
                    <td class="px-4 py-2">{{ c.Nombre_cargo }}</td>
                    <td class="px-4 py-2">{{ c.descripcion_cargo }}</td>                    
                    <td class="px-4 py-2 text-center">
                        <button (click)="eliminarCargos(c.Nombre_cargo)"
                            class="px-3 py-1 bg-red-600 text-white rounded-lg hover:bg-red-500">
                            🗑 Eliminar
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
