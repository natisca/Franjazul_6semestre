<div class="min-h-screen bg-gradient-to-br from-blue-50 via-blue-100 to-blue-500 flex items-center justify-center p-4 pt-24">
  
  <div class="w-full max-w-md shadow-2xl rounded-lg bg-white/95 backdrop-blur-sm p-8">
    
    <!-- Header -->
    <div class="text-center space-y-4 mb-6">
      <div class="mx-auto w-16 h-16 bg-blue-800 text-white rounded-full flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" />
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-gray-800">Cambiar Contraseña</h2>
      <p class="text-gray-500">Ingresa tu email y nueva contraseña</p>
    </div>

    <!-- Mensaje de error -->
    <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
      </svg>
      <span class="text-sm">{{ errorMessage }}</span>
    </div>

    <!-- Mensaje de éxito -->
    <div *ngIf="successMessage" class="mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span class="text-sm">{{ successMessage }}</span>
    </div>

    <!-- Formulario -->
    <form [formGroup]="cambioForm" (ngSubmit)="onSubmit()" class="space-y-4">
      
      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
          Correo Electrónico <span class="text-red-600">*</span>
        </label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="usuario@correo.com"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all placeholder-gray-400"
          [class.border-red-500]="email?.invalid && email?.touched"
        />
        <p *ngIf="email?.invalid && email?.touched" class="mt-1 text-xs text-red-600">
          Email válido es requerido
        </p>
      </div>

      <!-- Nueva Contraseña -->
      <div>
        <label for="passwordNueva" class="block text-sm font-medium text-gray-700 mb-1">
          Nueva Contraseña <span class="text-red-600">*</span>
        </label>
        <div class="relative">
          <input 
            id="passwordNueva" 
            [type]="showPasswordNueva ? 'text' : 'password'" 
            formControlName="passwordNueva" 
            placeholder="••••••••"
            class="w-full px-4 py-2 pr-10 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all placeholder-gray-400"
            [class.border-red-500]="passwordNueva?.invalid && passwordNueva?.touched"
          />
          <button 
            type="button" 
            (click)="togglePasswordNueva()"
            class="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600">
            <svg *ngIf="!showPasswordNueva" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <svg *ngIf="showPasswordNueva" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>
        <p *ngIf="passwordNueva?.invalid && passwordNueva?.touched" class="mt-1 text-xs text-red-600">
          Mínimo 6 caracteres
        </p>
      </div>

      <!-- Confirmar Nueva Contraseña -->
      <div>
        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">
          Confirmar Nueva Contraseña <span class="text-red-600">*</span>
        </label>
        <div class="relative">
          <input 
            id="confirmPassword" 
            [type]="showConfirmPassword ? 'text' : 'password'" 
            formControlName="confirmPassword" 
            placeholder="••••••••"
            class="w-full px-4 py-2 pr-10 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all placeholder-gray-400"
            [class.border-red-500]="confirmPassword?.invalid && confirmPassword?.touched"
          />
          <button 
            type="button" 
            (click)="toggleConfirmPassword()"
            class="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600">
            <svg *ngIf="!showConfirmPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <svg *ngIf="showConfirmPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>
        <p *ngIf="confirmPassword?.hasError('passwordMismatch') && confirmPassword?.touched" class="mt-1 text-xs text-red-600">
          Las contraseñas no coinciden
        </p>
      </div>

      <!-- Botón -->
      <button 
        type="submit" 
        [disabled]="loading || cambioForm.invalid"
        class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center justify-center gap-2 font-medium">
        <svg *ngIf="loading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>{{ loading ? 'Actualizando...' : 'Cambiar Contraseña' }}</span>
      </button>

      <!-- Link a Login -->
      <div class="text-center">
        <button 
          type="button"
          (click)="navegarLogin()"
          class="text-sm text-blue-600 hover:text-blue-800 font-medium">
          Volver al login
        </button>
      </div>

    </form>
  </div>
</div>
