<div *ngIf="isOpen" class="fixed inset-0 bg-black bg-opacity-50 z-40" (click)="onClose()"></div>
<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-md" (click)="$event.stopPropagation()">
    <div class="flex justify-between p-6 border-b">
      <h2 class="text-xl font-bold text-blue-900 dark:text-blue-400">{{ isEditMode ? 'Editar' : 'Nuevo' }} Servicio en Cita</h2>
      <button (click)="onClose()">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    
    <form [formGroup]="citaServicioForm" (ngSubmit)="onSubmit()" class="p-6">
      <div class="mb-4">
        <label class="block text-sm font-medium mb-2">Cita <span class="text-red-600">*</span>
          <span *ngIf="isEditMode" class="text-xs text-gray-500 font-normal ml-2">(No editable)</span>
        </label>
        <select formControlName="citaEnIntermedio" 
          class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700"
          [class.bg-gray-100]="isEditMode"
          [class.cursor-not-allowed]="isEditMode">
          <option [value]="null" disabled>Seleccione una cita</option>
          <option *ngFor="let c of citas" [value]="c.idCita">Cita #{{ c.idCita }}</option>
        </select>
      </div>
      
      <div class="mb-4">
        <label class="block text-sm font-medium mb-2">Servicio <span class="text-red-600">*</span>
          <span *ngIf="isEditMode" class="text-xs text-gray-500 font-normal ml-2">(No editable)</span>
        </label>
        <select formControlName="servicioEnIntermedio" 
          class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700"
          [class.bg-gray-100]="isEditMode"
          [class.cursor-not-allowed]="isEditMode">
          <option [value]="null" disabled>Seleccione un servicio</option>
          <option *ngFor="let s of servicios" [value]="s.idServicio">{{ s.nombreSer }}</option>
        </select>
      </div>
      
      <div class="mb-6">
        <label class="block text-sm font-medium mb-2">Cantidad <span class="text-red-600">*</span></label>
        <input type="number" formControlName="cantidadSer" min="1"
          class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700"
          [class.border-red-500]="cantidadSer?.invalid && cantidadSer?.touched">
        <div *ngIf="cantidadSer?.invalid && cantidadSer?.touched" class="mt-1">
          <p *ngIf="cantidadSer?.errors?.['required']" class="text-sm text-red-600">La cantidad es obligatoria</p>
          <p *ngIf="cantidadSer?.errors?.['min']" class="text-sm text-red-600">La cantidad mínima es 1</p>
        </div>
      </div>
      
      <div class="flex gap-3 justify-end">
        <button type="button" (click)="onClose()" class="px-4 py-2 border rounded-lg">Cancelar</button>
        <button type="submit" [disabled]="citaServicioForm.invalid" class="px-4 py-2 bg-blue-600 text-white rounded-lg disabled:bg-gray-400">
          {{ isEditMode ? 'Actualizar' : 'Crear' }}
        </button>
      </div>
    </form>
  </div>
</div>
