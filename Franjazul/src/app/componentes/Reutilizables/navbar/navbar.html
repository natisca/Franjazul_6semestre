<header class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-blue-200 border-b border-b-blue-400">
  <nav class="container mx-auto px-6 py-4">
    <div class="flex items-center justify-between">

      <!-- Logo / Nombre -->
      <a routerLink="/" (click)="scrollTop()" class="flex items-center gap-2 group">
        <div
          class="w-10 h-10 bg-blue-800 rounded-lg flex items-center justify-center transition-transform group-hover:scale-110">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24"
            stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 12.75c1.148 0 2.278.08 3.383.237 1.037.146 1.866.966 1.866 2.013 0 3.728-2.35 6.75-5.25 6.75S6.75 18.728 6.75 15c0-1.046.83-1.867 1.866-2.013A24.204 24.204 0 0 1 12 12.75Zm0 0c2.883 0 5.647.508 8.207 1.44a23.91 23.91 0 0 1-1.152 6.06M12 12.75c-2.883 0-5.647.508-8.208 1.44.125 2.104.52 4.136 1.153 6.06M12 12.75a2.25 2.25 0 0 0 2.248-2.354M12 12.75a2.25 2.25 0 0 1-2.248-2.354M12 8.25c.995 0 1.971-.08 2.922-.236.403-.066.74-.358.795-.762a3.778 3.778 0 0 0-.399-2.25M12 8.25c-.995 0-1.97-.08-2.922-.236-.402-.066-.74-.358-.795-.762a3.734 3.734 0 0 1 .4-2.253M12 8.25a2.25 2.25 0 0 0-2.248 2.146M12 8.25a2.25 2.25 0 0 1 2.248 2.146M8.683 5a6.032 6.032 0 0 1-1.155-1.002c.07-.63.27-1.222.574-1.747m.581 2.749A3.75 3.75 0 0 1 15.318 5m0 0c.427-.283.815-.62 1.155-.999a4.471 4.471 0 0 0-.575-1.752M4.921 6a24.048 24.048 0 0 0-.392 3.314c1.668.546 3.416.914 5.223 1.082M19.08 6c.205 1.08.337 2.187.392 3.314a23.882 23.882 0 0 1-5.223 1.082" />
          </svg>
        </div>
        <span class="text-xl font-bold italic text-blue-800">FranjAzul</span>

      </a>

      <!-- Menú derecho -->
      <div class="flex items-center gap-4">

        <!-- Si NO está autenticado -->
        <ng-container *ngIf="!isAuthenticated">
          <button (click)="navigateToLogin()"
            class="px-4 py-2 text-blue-800 font-medium hover:text-blue-600 transition-colors">
            Conectarse
          </button>
          <button (click)="navigateToRegistro()"
            class="px-4 py-2 bg-blue-800 text-white rounded-lg hover:bg-blue-600 transition-colors shadow-sm hover:shadow-md">
            Registrarse
          </button>
        </ng-container>

        <!-- Si está autenticado -->
        <ng-container *ngIf="isAuthenticated">
          <div class="flex items-center gap-3">

            <button (click)="handleLogout()"
              class="px-4 py-2 text-red-600 font-medium hover:bg-red-50 rounded-lg transition-colors">
              Desconectarse
            </button>
            <div class="flex items-center gap-2 px-3 py-2 bg-blue-50 rounded-lg">
              <div class="w-8 h-8 bg-blue-800 rounded-full flex items-center justify-center">
                <span class="text-xs font-bold text-white">{{ userName.charAt(0).toUpperCase() }}</span>
              </div>
              <span class="text-sm font-medium text-blue-900">{{ userName }}</span>
            </div>


          </div>
        </ng-container>

      </div>
    </div>
  </nav>
</header>

<!-- Spacer para que el contenido no quede debajo del navbar fijo -->
<div class="h-18"></div>
