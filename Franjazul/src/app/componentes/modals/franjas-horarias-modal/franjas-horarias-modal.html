<!-- Backdrop -->
<div 
  *ngIf="isOpen" 
  class="fixed inset-0 bg-black bg-opacity-50 z-40 transition-opacity duration-300"
  (click)="onClose()"
></div>

<!-- Modal -->
<div 
  *ngIf="isOpen"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto"
>
  <div 
    class="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-md transform transition-all duration-300 scale-100"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-700">
      <h2 class="text-xl font-bold text-blue-900 dark:text-blue-400">
        {{ isEditMode ? 'Editar Franja Horaria' : 'Nueva Franja Horaria' }}
      </h2>
      <button 
        (click)="onClose()"
        class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Body -->
    <form [formGroup]="franjaHorariaForm" (ngSubmit)="onSubmit()" class="p-6">
      <!-- Fecha y Hora de Inicio -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
          Fecha y Hora de Inicio <span class="text-red-600">*</span>
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
            </svg>
          </div>
          <input
            type="datetime-local"
            formControlName="fechaInicio"
            class="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100"
            [class.border-red-500]="fechaInicio?.invalid && fechaInicio?.touched"
            [class.border-gray-300]="fechaInicio?.valid || fechaInicio?.untouched"
          />
        </div>
        <div *ngIf="fechaInicio?.invalid && fechaInicio?.touched" class="mt-1">
          <p *ngIf="fechaInicio?.errors?.['required']" class="text-sm text-red-600">
            La fecha de inicio es obligatoria
          </p>
        </div>
      </div>

      <!-- Fecha y Hora de Fin -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
          Fecha y Hora de Fin <span class="text-red-600">*</span>
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
            </svg>
          </div>
          <input
            type="datetime-local"
            formControlName="fechaFin"
            class="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100"
            [class.border-red-500]="fechaFin?.invalid && fechaFin?.touched"
            [class.border-gray-300]="fechaFin?.valid || fechaFin?.untouched"
          />
        </div>
        <div *ngIf="fechaFin?.invalid && fechaFin?.touched" class="mt-1">
          <p *ngIf="fechaFin?.errors?.['required']" class="text-sm text-red-600">
            La fecha de fin es obligatoria
          </p>
        </div>
        <p class="text-xs text-gray-500 mt-1">
          La fecha de fin debe ser posterior a la fecha de inicio
        </p>
      </div>

      <!-- Botones -->
      <div class="flex gap-3 justify-end">
        <button
          type="button"
          (click)="onClose()"
          class="px-4 py-2 border border-gray-300 text-gray-700 dark:text-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="franjaHorariaForm.invalid"
          class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center gap-2"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          {{ isEditMode ? 'Actualizar' : 'Crear' }} Franja
        </button>
      </div>
    </form>
  </div>
</div>
