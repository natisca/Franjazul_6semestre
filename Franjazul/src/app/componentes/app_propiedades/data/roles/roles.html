<div class="p-6">
    <div class="flex item-center min-h-4">
        <h1 class="text-2xl font-bold text-blue-900">Roles</h1>
    </div>

    <div class="overflow-x-auto">
        <table class="min-w-full bg-white border border-gray-200 rounded-lg shadow-sm">
            <thead class="bg-blue-100">
                <tr>
                    <th class="px-4 py-2 text-left">ID</th>
                    <th class="px-4 py-2 text-left">Rol</th>
                    <th class="px-4 py-2 text-left">Descripción</th>
                    <th class="px-4 py-2 text-left">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let Rol of roles" class="border-t">
                    <td class="px-4 py-2">{{Rol.ID_rol}}</td>
                    <td class="px-4 py-2">{{Rol.nombre_rol}}</td>
                    <td class="px-4 py-2">{{Rol.descripcion_rol}}</td>
                    <td class="px-4 py-2 text-center">
                        <button (click)="eliminarRol(Rol.ID_rol)"
                            class="px-3 py-1 bg-red-600 text-white rounded-lg hover:bg-red-500">
                            🗑 Eliminar
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
