
<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
  
  <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-lg border border-blue-800">
    <h2 class="text-xl font-bold text-blue-900 mb-4">Solicitud de Servicio</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Nombre -->
      <div>
        <label class="block text-sm font-medium text-blue-900">Nombre *</label>
        <input type="text" formControlName="nombre"
          class="w-full border border-blue-800 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-700" />
        <p *ngIf="form.get('nombre')?.touched && form.get('nombre')?.invalid" class="text-red-500 text-xs mt-1">Campo
          requerido</p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

        <!-- Apellido 1 -->
        <div>
          <label class="block text-sm font-medium text-blue-900">Primer Apellido *</label>
          <input type="text" formControlName="apellido1"
            class="w-full border border-blue-800 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-700" />
          <p *ngIf="form.get('apellido1')?.touched && form.get('apellido1')?.invalid" class="text-red-500 text-xs mt-1">
            Campo requerido</p>
        </div>

        <!-- Apellido 2 -->
        <div>
          <label class="block text-sm font-medium text-blue-900">Segundo Apellido</label>
          <input type="text" formControlName="apellido2"
            class="w-full border border-blue-800 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-700" />
        </div>

        <!-- Cédula -->
        <div>
          <label class="block text-sm font-medium text-blue-900">Cédula *</label>
          <input type="text" formControlName="cedula"
            class="w-full border border-blue-800 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-700" />
          <p *ngIf="form.get('cedula')?.touched && form.get('cedula')?.invalid" class="text-red-500 text-xs mt-1">Campo
            requerido</p>
        </div>

        <!-- Teléfono -->
        <div>
          <label class="block text-sm font-medium text-blue-900">Teléfono *</label>
          <input type="text" formControlName="telefono"
            class="w-full border border-blue-800 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-700" />
          <p *ngIf="form.get('telefono')?.touched && form.get('telefono')?.invalid" class="text-red-500 text-xs mt-1">
            Campo requerido</p>
        </div>

      </div>

      <!-- Correo -->
      <div>
        <label class="block text-sm font-medium text-blue-900">Correo *</label>
        <input type="email" formControlName="correo"
          class="w-full border border-blue-800 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-700" />
        <p *ngIf="form.get('correo')?.touched && form.get('correo')?.invalid" class="text-red-500 text-xs mt-1">Ingrese
          un correo válido</p>
      </div>



      <!-- Tipo de Lugar -->
      <div>
        <label class="block text-sm font-medium text-blue-900">Tipo de Lugar *</label>
        <select formControlName="tipoLugar"
          class="w-full border border-blue-800 rounded-md p-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-700">
          <option value="">Seleccione una opción</option>
          <option *ngFor="let tipo of tiposLugar" [value]="tipo">{{ tipo }}</option>
        </select>
        <p *ngIf="form.get('tipoLugar')?.touched && form.get('tipoLugar')?.invalid" class="text-red-500 text-xs mt-1">
          Campo requerido</p>
      </div>

      <!-- Dirección -->
      <div>
        <label class="block text-sm font-medium text-blue-900">Dirección *</label>
        <input type="text" formControlName="direccion"
          class="w-full border border-blue-800 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-700" />
        <p *ngIf="form.get('direccion')?.touched && form.get('direccion')?.invalid" class="text-red-500 text-xs mt-1">
          Campo requerido</p>
      </div>

      <!-- Botones -->
      <div class="flex justify-end gap-3 pt-4">
        <button type="button" (click)="cerrarFormulario()"
          class="px-4 py-2 border border-blue-800 rounded-md text-blue-800 hover:bg-blue-800 hover:text-white transition-all">
          Cancelar
        </button>
        <button type="submit" class="px-4 py-2 bg-blue-800 text-white rounded-md hover:bg-blue-700 transition-all">
          Enviar Solicitud
        </button>
      </div>
    </form>
  </div>
</div>
