<div class="p-6">
    <div class="flex items-center mb-4">
        <h1 class="text-2xl font-bold text-blue-900">Franjas</h1>
    </div>


    <div class="overflow-x-auto">
        <table class="min-w-full bg-white border border-gray-200 rounded-lg shadow-sm">
            <thead class="bg-blue-100">
                <tr>
                    <th class="px-4 py-2 text-left">ID</th>
                    <th class="px-4 py-2 text-left">Fecha de inicio</th>
                    <th class="px-4 py-2 text-left">Fecha de fin</th>
                    <th class="px-4 py-2 text-center">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let lf of lista_franjas" class="border-t">
                    <td class="px-4 py-2">{{ lf.ID_franja }}</td>
                    <td class="px-4 py-2">{{ lf.fecha_inicio  | date:'dd/MM/yyyy'}}</td>
                    <td class="px-4 py-2">{{ lf.fecha_fin  | date:'dd/MM/yyyy'}}</td>
                    <td class="px-4 py-2 text-center">
                        <button (click)="EliminarFranjas(lf.ID_franja)"
                            class="px-3 py-1 bg-red-600 text-white rounded-lg hover:bg-red-500">
                            🗑 Eliminar
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Paginación -->
    <div class="flex justify-between items-center mt-4">
        <button (click)="anteriorPagina()" [disabled]="paginaActual === 0"
            class="px-4 py-2 bg-blue-200 hover:bg-gray-300 text-black rounded-lg disabled:opacity-50">⬅
            Anterior</button>
        <span>Página {{ paginaActual + 1 }}</span>
        <button (click)="siguientePagina()"
            class="px-4 py-2 bg-blue-200 hover:bg-gray-300 text-black rounded-lg">Siguiente ➡</button>
    </div>
</div>
