<!-- Modal Overlay -->
<div class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
  
  <!-- Modal Content - ALTURA CONTROLADA -->
  <div class="bg-white rounded-lg shadow-2xl max-w-2xl w-full flex flex-col" style="max-height: 90vh;">
    
    <!-- Header - FIJO EN LA PARTE SUPERIOR -->
    <div class="flex-shrink-0 bg-gradient-to-r from-blue-600 to-blue-800 text-white p-6 rounded-t-lg">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
            </svg>
          </div>
          <div>
            <h2 class="text-2xl font-bold">Solicitar Servicio</h2>
            <p class="text-blue-100 text-sm">Completa la información para agendar tu cita</p>
          </div>
        </div>
        <button 
          (click)="cerrarModal()"
          class="w-10 h-10 rounded-full hover:bg-white/20 flex items-center justify-center transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Body - SCROLLABLE -->
    <div class="flex-1 overflow-y-auto p-6 space-y-6">

      <!-- Mensajes -->
      <div *ngIf="errorMessage" class="p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
        </svg>
        <span class="text-sm">{{ errorMessage }}</span>
      </div>

      <div *ngIf="successMessage" class="p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="text-sm">{{ successMessage }}</span>
      </div>

      <!-- Formulario -->
      <form [formGroup]="solicitudForm" (ngSubmit)="onSubmit()" class="space-y-6">

        <!-- Sección: Servicios -->
        <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
          <h3 class="text-lg font-semibold text-blue-900 mb-4 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z" />
            </svg>
            Seleccionar Servicios
          </h3>

          <div class="flex flex-col sm:flex-row gap-2 mb-3">
            <!-- SELECT CON ALTURA MÁXIMA Y TEXTO TRUNCADO -->
            <select 
              formControlName="servicioSeleccionado"
              class="flex-1 px-4 py-2 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
              style="max-height: 200px;">
              <option value="">-- Selecciona un servicio --</option>
              <option 
                *ngFor="let servicio of serviciosDisponibles" 
                [value]="servicio.idServicio"
                [title]="servicio.nombreSer + ' - ' + servicio.descripcionSer"
                class="text-sm">
                {{ truncarTexto(servicio.nombreSer, 40) }}
              </option>
            </select>
            <button 
              type="button"
              (click)="agregarServicio()"
              class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors flex items-center justify-center gap-2 whitespace-nowrap">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
              </svg>
              Agregar
            </button>
          </div>

          <!-- Servicios seleccionados -->
          <div *ngIf="serviciosSeleccionados.length > 0" class="space-y-2">
            <p class="text-sm font-medium text-blue-900">Servicios seleccionados:</p>
            <div class="space-y-2">
              <div *ngFor="let servicio of serviciosSeleccionados" 
                   class="flex items-start gap-2 bg-white border border-blue-300 px-3 py-2 rounded-lg">
                <span class="text-sm font-medium text-blue-900 flex-1 break-words">
                  {{ servicio.nombreSer }}
                </span>
                <button 
                  type="button"
                  (click)="quitarServicio(servicio.idServicio)"
                  class="text-red-600 hover:text-red-800 flex-shrink-0 mt-0.5">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <p *ngIf="serviciosSeleccionados.length === 0" class="text-sm text-blue-600 mt-2">
            * Debes seleccionar al menos un servicio
          </p>
        </div>

        <!-- Sección: Fecha y Hora -->
        <div class="bg-purple-50 p-4 rounded-lg border border-purple-200">
          <h3 class="text-lg font-semibold text-purple-900 mb-4 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Fecha y Horario
          </h3>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Fecha <span class="text-red-600">*</span>
              </label>
              <input 
                type="date" 
                formControlName="fecha"
                [min]="minDate"
                class="w-full px-4 py-2 border border-purple-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                [class.border-red-500]="solicitudForm.get('fecha')?.invalid && solicitudForm.get('fecha')?.touched"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Horario (Franjas de 2 horas) <span class="text-red-600">*</span>
              </label>
              <select 
                formControlName="horario"
                class="w-full px-4 py-2 border border-purple-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                [class.border-red-500]="solicitudForm.get('horario')?.invalid && solicitudForm.get('horario')?.touched">
                <option value="">-- Selecciona horario --</option>
                <option *ngFor="let horario of horariosDisponibles" [value]="horario.inicio">
                  {{ horario.label }}
                </option>
              </select>
            </div>
          </div>
        </div>

        <!-- Sección: Dirección -->
        <div class="bg-green-50 p-4 rounded-lg border border-green-200">
          <h3 class="text-lg font-semibold text-green-900 mb-4 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
            </svg>
            Dirección del Servicio
          </h3>

          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Nombre del Lugar <span class="text-red-600">*</span>
              </label>
              <input 
                type="text" 
                formControlName="nombreLugar"
                placeholder="Ej: Apartamento 320, Restaurante crepes y waffles"
                maxlength="100"
                class="w-full px-4 py-2 border border-green-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
                [class.border-red-500]="solicitudForm.get('nombreLugar')?.invalid && solicitudForm.get('nombreLugar')?.touched"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Dirección Completa <span class="text-red-600">*</span>
              </label>
              <textarea 
                formControlName="direccionLugar"
                placeholder="Ej: Calle 123 #45-67, Barrio Centro, Bogotá"
                maxlength="200"
                rows="3"
                class="w-full px-4 py-2 border border-green-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent resize-none"
                [class.border-red-500]="solicitudForm.get('direccionLugar')?.invalid && solicitudForm.get('direccionLugar')?.touched">
              </textarea>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Tipo de Lugar <span class="text-red-600">*</span>
              </label>
              <select 
                formControlName="idTipoLugar"
                class="w-full px-4 py-2 border border-green-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
                [class.border-red-500]="solicitudForm.get('idTipoLugar')?.invalid && solicitudForm.get('idTipoLugar')?.touched">
                <option value="">-- Selecciona tipo de lugar --</option>
                <option *ngFor="let tipo of tiposLugar" [value]="tipo.idTl">
                  {{ tipo.nombreTl }}
                </option>
              </select>
            </div>
          </div>
        </div>

      </form>
    </div>

    <!-- Footer - FIJO EN LA PARTE INFERIOR -->
    <div class="flex-shrink-0 p-6 border-t bg-gray-50">
      <div class="flex gap-4">
        <button 
          type="button"
          (click)="cerrarModal()"
          class="flex-1 px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors font-medium">
          Cancelar
        </button>
        <button 
          type="submit"
          (click)="onSubmit()"
          [disabled]="loading || solicitudForm.invalid || serviciosSeleccionados.length === 0"
          class="flex-1 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center justify-center gap-2">
          <svg *ngIf="loading" class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>{{ loading ? 'Procesando...' : 'Solicitar Cita' }}</span>
        </button>
      </div>
    </div>

  </div>
</div>
