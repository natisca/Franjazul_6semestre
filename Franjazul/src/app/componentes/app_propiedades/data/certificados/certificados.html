<div class="p-6">
    <div class="flex items-center mb-4">
        <h1 class="text-2xl font-bold text-blue-900">Usuarios</h1>
    </div>


    <div class="overflow-x-auto">
        <table class="min-w-full bg-white border border-gray-200 rounded-lg shadow-sm">
            <thead class="bg-blue-100">
                <tr>
                    <th class="px-4 py-2 text-left">Codigo</th>
                    <th class="px-4 py-2 text-left">Adquirido</th>
                    <th class="px-4 py-2 text-left">Finaliza</th>
                    <th class="px-4 py-2 text-left">De que cita</th>
                    <th class="px-4 py-2 text-center">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let cer of listaCer" class="border-t">
                    <td class="px-4 py-2">{{ cer.codigo_CER }}</td>
                    <td class="px-4 py-2">{{ cer.fecha_emision | date:'dd/MM/yyyy'}}</td>
                    <td class="px-4 py-2">{{ cer.fecha_vence | date:'dd/MM/yyyy'}}</td>
                    <td class="px-4 py-2">{{ cer.cita_en_CER }}</td>
                    <td class="px-4 py-2 text-center">
                        <button (click)="eliminarCer(cer.codigo_CER)"
                            class="px-3 py-1 bg-red-600 text-white rounded-lg hover:bg-red-500">
                            🗑 Eliminar
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
