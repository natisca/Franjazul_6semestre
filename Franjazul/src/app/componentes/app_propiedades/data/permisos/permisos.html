<div class="p-6">
    <div class="flex items-center mb-4">
        <h1 class="text-2xl font-bold text-blue-900">Permisos</h1>
    </div>

    <div class="overflow-x-auto">
        <table class="min-w-full bg-white border-gray-200 rounded-lg shadow-sm">
            <thead class="bg-blue-100">
                <tr>
                    <th class="px-4 py-2 text-left">Perfil del Permiso</th>
                    <th class="px-4 py-2 text-left">Formulario del permiso</th>
                    <th class="px-4 py-2 text-left">Crear</th>
                    <th class="px-4 py-2 text-left">Borrar</th>
                    <th class="px-4 py-2 text-left">Editar</th>
                    <th class="px-4 py-2 text-left">Leer</th>
                    <th class="px-4 py-2 text-left">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let p of permisos" class="border-t">
                    <td class="px-4 py-2">{{p.ID_per_en_perm}}</td>
                    <td class="px-4 py-2">{{p.ID_form_en_perm}}</td>
                    <td class="px-4 py-2">{{p.Puede_crear}}</td>
                    <td class="px-4 py-2">{{p.puede_borrar}}</td>
                    <td class="px-4 py-2">{{p.puede_editar}}</td>
                    <td class="px-4 py-2">{{p.puede_leer}}</td>
                    <td class="px-4 py-2 text-center">
                        <button (click)="eliminarPermiso(p.ID_per_en_perm, p.ID_form_en_perm)"
                            class="px-3 py-1 bg-red-600 text-white rounded-lg hover:bg-red-500">
                            🗑 Eliminar
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
